# docker-compose.yml
services:
  backend:
    build: ./backend
    env_file: .env
    expose:
      - "8000"
  frontend:
    build: ./frontend
    environment:
      - API_BASE_URL=http://backend:8000
    expose:
      - "8050"
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend